syntax = "proto3";

package retail;

service InventoryService {
  rpc GetItem (ItemRequest) returns (ItemResponse);
}

service OrderService {
  rpc CreateOrder (OrderRequest) returns (OrderResponse);
}

message ItemRequest {
  string sku = 1;
}

message ItemResponse {
  string sku = 1;
  string name = 2;
  double price = 3;
  string currency = 4;
}

message OrderItem {
  string sku = 1;
  int32 quantity = 2;
}

message OrderRequest {
  repeated OrderItem items = 1;
}

message OrderLine {
  string sku = 1;
  string name = 2;
  int32 quantity = 3;
  double price = 4;
  double line_total = 5;
  string currency = 6;
}

message OrderResponse {
  repeated OrderLine lines = 1;
  double total = 2;
  string currency = 3;
}
